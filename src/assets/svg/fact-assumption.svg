  <rect x="400" y="40" width="280" height="180" rx="8" stroke-dasharray="6 5"/>
  <text x="180" y="74" font-family="sans-serif" font-size="17" text-anchor="middle" fill="currentColor" stroke="none">事实</text>
  <text x="540" y="74" font-family="sans-serif" font-size="17" text-anchor="middle" fill="currentColor" stroke="none">假设</text>
  <g font-family="sans-serif" font-size="12.5" fill="currentColor" stroke="none">
    <text x="70" y="108">可被观察或测量</text><text x="70" y="140">有来源与证据</text><text x="70" y="172">在不同条件下可复现</text><text x="70" y="204">例：材料成本、物理定律</text>

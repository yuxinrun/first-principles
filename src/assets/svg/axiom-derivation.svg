    <text x="105" y="126" font-family="sans-serif" font-size="14" text-anchor="middle" fill="currentColor" stroke="none">公理 A</text>
    <text x="105" y="204" font-family="sans-serif" font-size="14" text-anchor="middle" fill="currentColor" stroke="none">公理 B</text>
  </g>
  <path d="M180 120h90M180 198h90M270 120v78M270 159h90"/>
